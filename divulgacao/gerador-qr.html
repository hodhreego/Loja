<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de QR Code — Loja de Matemática</title>
<style>
  :root{
    --azul:#1f3a68; --azul2:#2f6fb3; --cinza:#eef2f8; --texto:#22303f; --borda:#d5dfec;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:linear-gradient(180deg,#f7fafd,#eef3f9);color:var(--texto);min-height:100vh;padding:24px}
  .wrap{max-width:980px;margin:0 auto}
  header{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .logo{width:44px;height:44px;border-radius:12px;background:var(--azul);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px}
  h1{font-size:22px;margin:0}
  header p{margin:2px 0 0;color:#5b6b7d;font-size:13px}
  .grid{display:grid;grid-template-columns:1.15fr .85fr;gap:20px}
  @media (max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--borda);border-radius:16px;padding:18px;box-shadow:0 8px 24px rgba(31,58,104,.06)}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px;color:#3a4a5c}
  input[type=text],textarea,select{width:100%;padding:11px 12px;border:1px solid var(--borda);border-radius:10px;font:inherit;color:var(--texto);background:#fbfdff}
  textarea{min-height:74px;resize:vertical}
  input[type=color]{width:46px;height:36px;padding:2px;border:1px solid var(--borda);border-radius:8px;background:#fff}
  .linha{display:flex;gap:12px;flex-wrap:wrap}
  .linha>div{flex:1;min-width:120px}
  .preset{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .preset button{font-size:12px;padding:7px 10px;border-radius:999px;border:1px solid var(--borda);background:#fff;cursor:pointer}
  .preset button:hover{background:var(--cinza)}
  .botoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .btn{border:0;border-radius:10px;padding:12px 16px;font-weight:600;cursor:pointer;font-size:14px}
  .btn.principal{background:var(--azul);color:#fff}
  .btn.principal:hover{background:#173055}
  .btn.sec{background:#fff;color:var(--azul);border:1px solid var(--azul)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .preview{display:grid;place-items:center;min-height:320px;background:
    conic-gradient(#f1f5fa 25%, #fff 0 50%, #f1f5fa 0 75%, #fff 0) 0 0/24px 24px;
    border:1px dashed var(--borda);border-radius:14px;padding:14px}
  #qrcode{display:flex;align-items:center;justify-content:center;background:#fff;padding:12px;border-radius:10px}
  #qrcode canvas,#qrcode img{display:block;max-width:100%;height:auto}
  .info{font-size:12px;color:#6b7c8f;margin-top:10px;line-height:1.5}
  .ok{color:#1c7a4a;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">∑</div>
    <div>
      <h1>Gerador de QR Code</h1>
      <p>Loja de Matemática · digite o link, ajuste e baixe em PNG</p>
    </div>
  </header>

  <div class="grid">
    <section class="card">
      <label for="texto">Link ou texto do QR</label>
      <textarea id="texto" placeholder="https://eduloja.com">https://eduloja.com</textarea>

      <div class="preset">
        <button data-v="https://wa.me/c/554599699444">Catálogo WhatsApp</button>
        <button data-v="https://eduloja.com">eduloja.com</button>
        <button data-v="https://eduloja.com/produtos">Produtos</button>
      </div>

      <div class="linha">
        <div>
          <label for="tam">Tamanho (px)</label>
          <select id="tam">
            <option>256</option>
            <option selected>512</option>
            <option>1024</option>
            <option>2048</option>
          </select>
        </div>
        <div>
          <label for="margem">Margem (módulos)</label>
          <select id="margem">
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2" selected>2</option>
            <option value="4">4</option>
          </select>
        </div>
        <div>
          <label for="nivel">Correção de erro</label>
          <select id="nivel">
            <option value="L">L (7%)</option>
            <option value="M" selected>M (15%)</option>
            <option value="Q">Q (25%)</option>
            <option value="H">H (30%)</option>
          </select>
        </div>
      </div>

      <div class="linha" style="margin-top:6px">
        <div>
          <label for="cor1">Cor do código</label>
          <input type="color" id="cor1" value="#1f3a68">
        </div>
        <div>
          <label for="cor2">Fundo</label>
          <input type="color" id="cor2" value="#ffffff">
        </div>
        <div>
          <label for="nome">Nome do arquivo</label>
          <input type="text" id="nome" value="qr-eduloja">
        </div>
      </div>

      <div class="botoes">
        <button class="btn principal" id="baixar">Baixar PNG</button>
        <button class="btn sec" id="copiar">Copiar link</button>
      </div>
      <p class="info">Dica: para impressão use 1024 px ou mais e margem 2–4. O fundo claro é obrigatório para leitura.</p>
    </section>

    <section class="card">
      <div class="preview"><div id="qrcode"></div></div>
      <p class="info" id="aviso">Gerando…</p>
    </section>
  </div>
</div>

<script src="qrcode.min.js"></script>
<script>
(function(){
  var texto = document.getElementById('texto');
  var tam = document.getElementById('tam');
  var margem = document.getElementById('margem');
  var nivel = document.getElementById('nivel');
  var cor1 = document.getElementById('cor1');
  var cor2 = document.getElementById('cor2');
  var nome = document.getElementById('nome');
  var alvo = document.getElementById('qrcode');
  var aviso = document.getElementById('aviso');

  var niveis = {L: QRCode.CorrectLevel.L, M: QRCode.CorrectLevel.M, Q: QRCode.CorrectLevel.Q, H: QRCode.CorrectLevel.H};
  var atual = null;

  function gerar(){
    var t = texto.value.trim();
    alvo.innerHTML = '';
    if (!t) { aviso.textContent = 'Digite um link ou texto.'; atual = null; return; }
    var lado = parseInt(tam.value, 10);
    atual = new QRCode(alvo, {
      text: t,
      width: lado,
      height: lado,
      colorDark: cor1.value,
      colorLight: cor2.value,
      correctLevel: niveis[nivel.value]
    });
    aviso.innerHTML = 'Pronto · ' + lado + ' px · correção ' + nivel.value;
  }

  function canvasFinal(){
    var c = alvo.querySelector('canvas');
    if (!c) return null;
    var mods = parseInt(margem.value, 10);
    var lado = c.width;
    var pad = Math.round(lado * mods / 40);
    var out = document.createElement('canvas');
    out.width = lado + pad * 2;
    out.height = lado + pad * 2;
    var ctx = out.getContext('2d');
    ctx.fillStyle = cor2.value;
    ctx.fillRect(0, 0, out.width, out.height);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(c, pad, pad, lado, lado);
    return out;
  }

  document.getElementById('baixar').addEventListener('click', function(){
    var out = canvasFinal();
    if (!out) { alert('Gere um QR primeiro.'); return; }
    var a = document.createElement('a');
    a.href = out.toDataURL('image/png');
    a.download = (nome.value.trim() || 'qrcode') + '.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    aviso.innerHTML = '<span class="ok">Baixado:</span> ' + a.download;
  });

  document.getElementById('copiar').addEventListener('click', function(){
    navigator.clipboard.writeText(texto.value.trim()).then(function(){
      aviso.innerHTML = '<span class="ok">Link copiado.</span>';
    }, function(){ aviso.textContent = 'Não consegui copiar.'; });
  });

  document.querySelectorAll('.preset button').forEach(function(b){
    b.addEventListener('click', function(){
      texto.value = b.getAttribute('data-v');
      gerar();
    });
  });

  ['input','change'].forEach(function(ev){
    [texto, tam, margem, nivel, cor1, cor2].forEach(function(el){
      el.addEventListener(ev, gerar);
    });
  });

  gerar();
})();
</script>
</body>
</html>
