<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>Mapa dos Astros</title>
<meta name="description" content="Explore a Lua, Marte, Mercúrio e Ceres em 3D com imagens de satélite da NASA.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='80' font-size='84' text-anchor='middle'%3E🌙%3C/text%3E%3C/svg%3E">

<!-- CesiumJS (versão fixa) via jsDelivr. Nenhum recurso do Cesium Ion é usado. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Widgets/widgets.css">
<script src="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Cesium.js"></script>

<style>
  /* ===== Tema escuro, pensado primeiro para celular ===== */
  :root{
    --fundo:#0b0e14; --painel:#141926; --painel2:#1c2333; --borda:#2a3350;
    --texto:#e8ecf5; --suave:#9aa6c4; --destaque:#ffcf5a; --azul:#6cb6ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--fundo);color:var(--texto);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible,select:focus-visible{outline:3px solid var(--azul);outline-offset:2px}

  /* Barra superior */
  #barra{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));
    background:var(--painel);border-bottom:1px solid var(--borda);z-index:30}
  #barra h1{font-size:1.1rem;margin:0;flex:1 1 auto;white-space:nowrap}
  .botao{background:var(--painel2);border:1px solid var(--borda);border-radius:10px;
    padding:10px 14px;min-height:44px;font-weight:600}
  .botao:hover{border-color:var(--azul)}
  .botao[aria-expanded="true"]{background:var(--azul);color:#06121f;border-color:var(--azul)}
  #astros{display:flex;gap:6px;flex:1 1 100%;overflow-x:auto;padding-bottom:2px}
  .astro{flex:0 0 auto;border-radius:999px;padding:8px 14px;min-height:40px;
    background:var(--painel2);border:1px solid var(--borda);font-weight:600}
  .astro[aria-pressed="true"]{background:var(--destaque);color:#241a00;border-color:var(--destaque)}

  /* Área do mapa */
  #principal{position:relative;flex:1 1 auto;min-height:0}
  #mapa{position:absolute;inset:0;background:#000}
  .cesium-viewer-bottom,.cesium-widget-credits{display:none!important} /* créditos do Cesium vão ao rodapé */

  #voltar{position:absolute;left:12px;top:12px;z-index:20;box-shadow:0 4px 14px #0008}

  /* Lista de lugares (gaveta) */
  #lista{position:absolute;z-index:25;left:0;right:0;top:0;max-height:70%;overflow:auto;
    background:var(--painel);border-bottom:1px solid var(--borda);padding:8px 12px 12px;
    box-shadow:0 8px 24px #000a}
  #lista[hidden]{display:none}
  #lista h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--suave);margin:12px 4px 6px}
  #lista ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  .item{width:100%;display:flex;align-items:center;gap:10px;text-align:left;
    background:var(--painel2);border:1px solid var(--borda);border-radius:10px;padding:10px 12px;min-height:48px}
  .item:hover{border-color:var(--destaque)}
  .pino{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
    font-weight:800;font-size:.8rem;color:#101010}

  /* Painel de informações (folha inferior no celular) */
  #info{position:absolute;z-index:22;left:8px;right:8px;bottom:8px;max-height:58%;overflow:auto;
    background:var(--painel);border:1px solid var(--borda);border-radius:16px;padding:14px 16px 16px;
    box-shadow:0 8px 28px #000c}
  #info[hidden]{display:none}
  #info h2{margin:0 40px 6px 0;font-size:1.25rem}
  #fechar{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:50%;
    background:var(--painel2);border:1px solid var(--borda);font-size:1.2rem}
  .tag{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;color:#101010}
  dl{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.95rem}
  dt{color:var(--suave)} dd{margin:0}
  .curiosidade{margin:12px 0 0;padding:10px 12px;background:var(--painel2);border-left:4px solid var(--destaque);
    border-radius:8px;line-height:1.45;font-size:1rem}

  /* Avisos e carregamento */
  #aviso{position:absolute;z-index:40;top:68px;pointer-events:none;left:50%;transform:translateX(-50%);width:min(92%,520px);
    background:#3a2a05;color:#ffe9b0;border:1px solid #8a6a1a;border-radius:10px;padding:10px 14px;font-size:.9rem}
  #aviso[hidden]{display:none}
  #dica{position:absolute;z-index:15;left:50%;bottom:72px;transform:translateX(-50%);
    background:#000a;padding:8px 14px;border-radius:999px;font-size:.85rem;color:var(--suave);
    pointer-events:none;transition:opacity .6s;text-align:center;width:max-content;max-width:92%}
  #carregando{position:absolute;inset:0;z-index:50;background:var(--fundo);display:grid;place-items:center;
    transition:opacity .5s;text-align:center;color:var(--suave)}
  #carregando.some{opacity:0;pointer-events:none}

  /* Rodapé de créditos (visível sempre); o logo do Cesium deixa de ser flutuante */
  #creditoCesium .cesium-credit-logoContainer{position:static!important}
  #creditos{padding:6px 12px;font-size:.72rem;line-height:1.35;color:var(--suave);
    background:var(--painel);border-top:1px solid var(--borda);z-index:30}
  #creditoCesium .cesium-credit-logoContainer img{height:16px;vertical-align:middle}
  #creditoCesium{display:inline}
  #creditoCesium *{display:inline!important;color:var(--suave)!important}

  /* Telas largas: gaveta e painel viram colunas laterais */
  @media (min-width:760px){
    #astros{flex:0 1 auto}
    #barra{flex-wrap:nowrap}
    #lista{width:340px;right:auto;top:12px;left:12px;max-height:calc(100% - 24px);border:1px solid var(--borda);border-radius:14px}
    #info{left:auto;right:12px;bottom:12px;width:380px;max-height:calc(100% - 24px)}
    #voltar{left:auto;right:12px}
  }
</style>
</head>
<body>

<header id="barra">
  <h1>🪐 Mapa dos Astros</h1>
  <button id="btnLista" class="botao" aria-expanded="false" aria-controls="lista">Lista de lugares</button>
  <nav id="astros" aria-label="Escolha o astro"></nav>
</header>

<main id="principal">
  <div id="mapa"></div>
  <button id="voltar" class="botao">⟲ Voltar à <span id="nomeVoltar">Lua</span> inteira</button>

  <section id="lista" hidden aria-label="Lista de lugares"></section>

  <section id="info" hidden aria-live="polite">
    <button id="fechar" aria-label="Fechar">✕</button>
    <h2 id="iNome"></h2>
    <span id="iTipo" class="tag"></span>
    <dl>
      <dt>Tamanho</dt><dd id="iTamanho"></dd>
      <dt id="iDetalheRot" hidden>Missão</dt><dd id="iDetalhe" hidden></dd>
      <dt>Posição</dt><dd id="iCoord"></dd>
    </dl>
    <p class="curiosidade">💡 <span id="iCuriosidade"></span></p>
  </section>

  <div id="aviso" role="status" hidden></div>
  <div id="dica">Arraste para girar · pinça (ou roda do mouse) para aproximar · toque nos pinos</div>
  <div id="carregando"><div><div style="font-size:3rem">🌙</div>Carregando…</div></div>
</main>

<footer id="creditos">
  <span id="creditoImagem"></span>
  · Mapa 3D: <span id="creditoCesium"></span>
</footer>

<script>

/* ---------- Estado e atalhos ---------- */
const $ = id => document.getElementById(id);
let viewer = null;          // visualizador Cesium atual
let astro = null;           // astro atual
let entidadeSel = null;     // pino selecionado
let seq = 0;                // evita corridas ao trocar de astro rápido
const rad = Cesium.Math.toRadians;

/* Formata coordenada em português: 0,67° N / 23,47° L */
function fmtCoord(lat, lon){
  const f = n => Math.abs(n).toLocaleString("pt-BR", {maximumFractionDigits:2, minimumFractionDigits:2});
  return `${f(lat)}° ${lat >= 0 ? "N" : "S"} · ${f(lon)}° ${lon >= 0 ? "L" : "O"}`;
}

/* Cria o desenho SVG do pino (cor e letra por tipo) */
function imagemPino(tipo, selecionado){
  const t = TIPOS[tipo];
  const borda = selecionado ? "#ffffff" : "#101010";
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="60" viewBox="0 0 48 60">
    <path d="M24 58 C24 58 4 34 4 22 A20 20 0 0 1 44 22 C44 34 24 58 24 58Z" fill="${t.cor}" stroke="${borda}" stroke-width="3"/>
    <text x="24" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="20" fill="#101010">${t.letra}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

/* Aviso amarelo no topo do mapa */
function avisar(msg){ const a = $("aviso"); a.textContent = msg; a.hidden = !msg; }

/* =====================================================================
   IMAGEM DA NASA (WMTS do Solar System Treks)
   Fluxo: lê o GetCapabilities da camada (nome de matriz, níveis,
   endereço dos tiles) -> testa o tile 0/0/0 -> usa. Se falhar, tenta a
   próxima camada; se todas falharem, mostra esfera cinza com grade.
   ===================================================================== */
const BASE_TREK = "https://trek.nasa.gov/tiles";

/* Texto do primeiro filho com certo nome local (ignora prefixo ows:) */
function filho(el, nome){
  for (const c of el.children) if (c.localName === nome) return c;
  return null;
}

/* Lê o GetCapabilities; devolve configuração ou null se não der (rede/CORS) */
async function lerCapabilities(pasta, camada){
  const url = `${BASE_TREK}/${pasta}/EQ/${camada.nome}/1.0.0/WMTSCapabilities.xml`;
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 8000);
  try{
    const r = await fetch(url, {signal: ctl.signal}); if (!r.ok) return null;
    const xml = new DOMParser().parseFromString(await r.text(), "application/xml");
    const g = n => Array.from(xml.getElementsByTagNameNS("*", n));
    const res = g("ResourceURL").find(e => e.getAttribute("resourceType") === "tile");
    const conj = g("TileMatrixSet").find(e => filho(e, "TileMatrix"));   // conjunto de matrizes
    if (!res || !conj) return null;
    const matrizes = Array.from(conj.children).filter(c => c.localName === "TileMatrix");
    const estilo = g("Style").map(e => filho(e, "Identifier")).find(Boolean);
    return {
      modelo: res.getAttribute("template"),
      estilo: estilo ? estilo.textContent.trim() : "default",
      conjunto: filho(conj, "Identifier").textContent.trim(),
      rotulos: matrizes.map(m => filho(m, "Identifier").textContent.trim()),
      largura0: +filho(matrizes[0], "MatrixWidth").textContent,
      altura0: +filho(matrizes[0], "MatrixHeight").textContent
    };
  }catch(e){ return null; } finally{ clearTimeout(t); }
}

/* Configuração padrão (padrão conhecido do Trek), usada se o Capabilities não abrir */
function configPadrao(pasta, camada){
  return {
    modelo: `${BASE_TREK}/${pasta}/EQ/${camada.nome}/1.0.0/{Style}/{TileMatrixSet}/{TileMatrix}/{TileRow}/{TileCol}.${camada.ext}`,
    estilo: "default", conjunto: "default028mm",
    rotulos: [0,1,2,3,4,5,6,7].map(String), largura0: 2, altura0: 1
  };
}

/* Verifica se o tile 0/0/0 carrega como imagem (testa também o CORS) */
function testarTile(cfg){
  const url = cfg.modelo.replace(/\{style\}/i, cfg.estilo).replace("{TileMatrixSet}", cfg.conjunto)
    .replace("{TileMatrix}", cfg.rotulos[0]).replace("{TileRow}", 0).replace("{TileCol}", 0);
  return new Promise(ok => {
    const img = new Image(); img.crossOrigin = "anonymous";
    const t = setTimeout(() => ok(false), 10000);
    img.onload = () => { clearTimeout(t); ok(true); };
    img.onerror = () => { clearTimeout(t); ok(false); };
    img.src = url;
  });
}

/* Procura uma camada que funcione e a adiciona ao globo */
async function adicionarImagem(v, a, minhaSeq){
  for (let i = 0; i < a.camadas.length; i++){
    const cam = a.camadas[i];
    const cfg = (await lerCapabilities(a.pasta, cam)) || configPadrao(a.pasta, cam);
    if (!(await testarTile(cfg))) continue;
    if (minhaSeq !== seq) return true;                   // usuário já trocou de astro
    const prov = new Cesium.WebMapTileServiceImageryProvider({
      url: cfg.modelo, layer: cam.nome, style: cfg.estilo, format: "image/" + cam.ext,
      tileMatrixSetID: cfg.conjunto, tileMatrixLabels: cfg.rotulos,
      maximumLevel: cfg.rotulos.length - 1, tileWidth: 256, tileHeight: 256,
      tilingScheme: new Cesium.GeographicTilingScheme({
        ellipsoid: Cesium.Ellipsoid.default,
        numberOfLevelZeroTilesX: cfg.largura0, numberOfLevelZeroTilesY: cfg.altura0 }),
      credit: a.credito
    });
    v.imageryLayers.addImageryProvider(prov);
    if (i > 0) avisar("A camada principal da NASA não respondeu; usando uma camada alternativa (relevo colorido).");
    return true;
  }
  /* Nada funcionou: esfera cinza com grade de latitude/longitude */
  v.imageryLayers.addImageryProvider(new Cesium.GridImageryProvider({
    tilingScheme: new Cesium.GeographicTilingScheme({ellipsoid: Cesium.Ellipsoid.default}),
    cells: 8, color: Cesium.Color.fromCssColorString("#6cb6ff"), glowColor: Cesium.Color.TRANSPARENT,
    backgroundColor: Cesium.Color.fromCssColorString("#2a2f3d") }));
  avisar("Não foi possível carregar as imagens da NASA agora. Os lugares continuam funcionando sobre uma esfera com grade.");
  return false;
}

/* =====================================================================
   CÂMERA
   ===================================================================== */
/* Altura da câmera para enxergar o astro inteiro, mesmo em tela vertical */
function alturaInicio(){
  const c = viewer.canvas, aspecto = c.clientWidth / Math.max(1, c.clientHeight);
  /* fov vale para o maior lado da tela; o menor lado enxerga um ângulo menor */
  const metade = Math.atan(Math.tan(viewer.camera.frustum.fov / 2) * Math.min(aspecto, 1 / aspecto));
  return astro.raio * (1.15 / Math.sin(metade) - 1);
}

function visaoInicial(animar){
  const destino = Cesium.Cartesian3.fromDegrees(0, 0, alturaInicio());
  const orient = {heading: 0, pitch: -Cesium.Math.PI_OVER_TWO, roll: 0};
  if (animar) viewer.camera.flyTo({destination: destino, orientation: orient, duration: 2});
  else viewer.camera.setView({destination: destino, orientation: orient});
}

function voarPara(l){
  const pos = Cesium.Cartesian3.fromDegrees(l.lon, l.lat, 0);
  viewer.camera.flyToBoundingSphere(new Cesium.BoundingSphere(pos, 1), {
    offset: new Cesium.HeadingPitchRange(0, -Cesium.Math.PI_OVER_TWO, l.alcance * 1000),
    duration: 2.5 });
}

/* =====================================================================
   MARCADORES E PAINEL
   ===================================================================== */
function criarMarcadores(){
  for (const l of astro.lugares){
    l.entidade = viewer.entities.add({
      name: l.nome, position: Cesium.Cartesian3.fromDegrees(l.lon, l.lat, 0),
      billboard: { image: imagemPino(l.tipo, false), width: 34, height: 42,
        verticalOrigin: Cesium.VerticalOrigin.BOTTOM },
      label: { text: l.nome, font: "600 14px system-ui,sans-serif", fillColor: Cesium.Color.WHITE,
        outlineColor: Cesium.Color.BLACK, outlineWidth: 4, style: Cesium.LabelStyle.FILL_AND_OUTLINE,
        verticalOrigin: Cesium.VerticalOrigin.TOP, pixelOffset: new Cesium.Cartesian2(0, 4),
        /* rótulos só aparecem quando a câmera está perto o bastante (evita poluição) */
        distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, astro.raio * 1.9) }
    });
    l.entidade._lugar = l;
  }
}

function abrirInfo(l){
  const t = TIPOS[l.tipo];
  $("iNome").textContent = l.nome;
  $("iTipo").textContent = t.rotulo; $("iTipo").style.background = t.cor;
  $("iTamanho").textContent = l.tamanho;
  $("iCoord").textContent = fmtCoord(l.lat, l.lon);
  $("iCuriosidade").textContent = l.curiosidade;
  $("iDetalhe").textContent = l.detalhe || ""; $("iDetalhe").hidden = $("iDetalheRot").hidden = !l.detalhe;
  $("info").hidden = false;
}

function selecionar(l){
  if (entidadeSel) entidadeSel.billboard.image = imagemPino(entidadeSel._lugar.tipo, false);
  entidadeSel = l ? l.entidade : null;
  if (l){ l.entidade.billboard.image = imagemPino(l.tipo, true); abrirInfo(l); }
  else $("info").hidden = true;
  if (viewer) viewer.scene.requestRender();
}

function irPara(l){ selecionar(l); voarPara(l); fecharLista(); }

/* Lista de lugares agrupada por tipo */
function montarLista(){
  const sec = $("lista"); sec.innerHTML = "";
  for (const [chave, t] of Object.entries(TIPOS)){
    const itens = astro.lugares.filter(l => l.tipo === chave); if (!itens.length) continue;
    const h = document.createElement("h2"); h.textContent = t.rotulo + "s"; sec.appendChild(h);
    const ul = document.createElement("ul");
    for (const l of itens){
      const li = document.createElement("li"), b = document.createElement("button");
      b.className = "item";
      b.innerHTML = `<span class="pino" style="background:${t.cor}">${t.letra}</span><span></span>`;
      b.lastChild.textContent = l.nome;
      b.onclick = () => irPara(l);
      li.appendChild(b); ul.appendChild(li);
    }
    sec.appendChild(ul);
  }
}
function fecharLista(){ $("lista").hidden = true; $("btnLista").setAttribute("aria-expanded", "false"); }

/* =====================================================================
   CRIAÇÃO DO GLOBO (um novo Viewer por astro, pois o raio muda)
   ===================================================================== */
async function carregarAstro(a){
  const minhaSeq = ++seq;
  astro = a; entidadeSel = null;
  $("carregando").classList.remove("some"); avisar(""); $("info").hidden = true; fecharLista();
  if (viewer){ viewer.destroy(); viewer = null; }

  /* Todos os cálculos do Cesium passam a usar o raio do astro escolhido */
  const elipsoide = a.id === "lua" && Cesium.Ellipsoid.MOON ? Cesium.Ellipsoid.MOON
                                                            : new Cesium.Ellipsoid(a.raio, a.raio, a.raio);
  Cesium.Ellipsoid.default = elipsoide;

  viewer = new Cesium.Viewer("mapa", {
    baseLayer: false,                         // sem imagem do Cesium Ion
    terrain: undefined, geocoder: false, baseLayerPicker: false, homeButton: false,
    sceneModePicker: false, navigationHelpButton: false, animation: false, timeline: false,
    fullscreenButton: false, infoBox: false, selectionIndicator: false,
    scene3DOnly: true, skyBox: false, skyAtmosphere: false, requestRenderMode: true,
    maximumRenderTimeChange: Infinity, creditContainer: $("creditoCesium"),
    mapProjection: new Cesium.GeographicProjection(elipsoide),
    globe: new Cesium.Globe(elipsoide)
  });
  const cena = viewer.scene;
  cena.backgroundColor = Cesium.Color.BLACK;
  cena.sun && (cena.sun.show = false); cena.moon && (cena.moon.show = false);
  cena.fog.enabled = false;
  cena.globe.enableLighting = false;          // imagem uniforme, sem sombra do Sol
  cena.globe.showGroundAtmosphere = false;
  cena.globe.baseColor = Cesium.Color.fromCssColorString("#2a2f3d");
  cena.globe.depthTestAgainstTerrain = false;

  /* Zoom/rotação: mouse e toque (arrastar = girar, pinça = zoom) */
  const ctl = cena.screenSpaceCameraController;
  ctl.minimumZoomDistance = a.raio * 0.01;
  ctl.maximumZoomDistance = a.raio * 8;
  ctl.enableTilt = true;

  /* Toque/clique em um pino (área de toque ampliada para dedos) */
  const mao = new Cesium.ScreenSpaceEventHandler(viewer.canvas);
  mao.setInputAction(e => {
    const obj = cena.pick(e.position, 28, 28);
    if (Cesium.defined(obj) && obj.id && obj.id._lugar) selecionar(obj.id._lugar);
    else selecionar(null);
  }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

  criarMarcadores(); montarLista(); visaoInicial(false);
  $("nomeVoltar").textContent = a.nome;
  $("creditoImagem").textContent = a.credito;
  document.querySelectorAll(".astro").forEach(b => b.setAttribute("aria-pressed", b.dataset.id === a.id));

  await adicionarImagem(viewer, a, minhaSeq);
  if (minhaSeq !== seq) return;
  viewer.scene.requestRender();

  /* Some a tela de carregamento quando os primeiros tiles chegarem (ou após 8 s) */
  const esconder = () => $("carregando").classList.add("some");
  const rem = cena.globe.tileLoadProgressEvent.addEventListener(n => { if (n === 0){ esconder(); rem(); } });
  setTimeout(esconder, 8000);
}

/* =====================================================================
   INICIALIZAÇÃO
   ===================================================================== */
function iniciar(){
  if (typeof Cesium === "undefined"){
    $("carregando").innerHTML = "Não foi possível carregar o mapa 3D (biblioteca Cesium). Verifique a internet e recarregue a página.";
    return;
  }
  /* Botões de astro */
  for (const a of ASTROS){
    const b = document.createElement("button");
    b.className = "astro"; b.dataset.id = a.id; b.textContent = `${a.emoji} ${a.nome}`;
    b.setAttribute("aria-pressed", "false");
    b.onclick = () => { if (a !== astro) carregarAstro(a); };
    $("astros").appendChild(b);
  }
  $("btnLista").onclick = () => {
    const abrir = $("lista").hidden; $("lista").hidden = !abrir;
    $("btnLista").setAttribute("aria-expanded", String(abrir));
  };
  $("voltar").onclick = () => { selecionar(null); if (viewer) visaoInicial(true); };
  $("fechar").onclick = () => selecionar(null);
  document.addEventListener("keydown", e => { if (e.key === "Escape"){ selecionar(null); fecharLista(); } });
  setTimeout(() => { $("dica").style.opacity = 0; }, 7000);

  try{ carregarAstro(ASTROS[0]); }
  catch(e){
    $("carregando").textContent = "Seu navegador não conseguiu iniciar o 3D (WebGL). Tente outro navegador.";
    console.error(e);
  }
}
iniciar();
</script>
