<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050914">
<title>Mapa dos Astros</title>
<meta name="description" content="Explore planetas, luas, asteroides e a Estação Espacial Internacional em 3D, com imagens de satélite da NASA.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='80' font-size='84' text-anchor='middle'%3E🪐%3C/text%3E%3C/svg%3E">

<!-- Tipografia da identidade da loja -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- three.js: carregado só quando a pessoa abre um arquivo STL/OBJ no visor de objetos 3D -->
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"}}</script>

<!-- CesiumJS (versão fixa) via jsDelivr. Nenhum recurso do Cesium Ion é usado. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Widgets/widgets.css">
<script src="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Cesium.js"></script>

<style>
  /* =====================================================================
     IDENTIDADE: azul-marinho profundo + dourado (mesma da loja)
     VIDRO LÍQUIDO: quase transparente, com lente, borda de luz e brilho que segue o toque
     ===================================================================== */
  @property --mx{syntax:"<percentage>";inherits:true;initial-value:26%}
  @property --my{syntax:"<percentage>";inherits:true;initial-value:-10%}
  :root{
    --gold:#C9A227; --gold-light:#E9D48E; --texto:#f4f7ff; --suave:#b4c1dd;
    --serif:'Playfair Display',Georgia,serif;
    --sans:'Source Sans 3',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --gap:12px; --raio:24px; --alvo:46px;               /* --alvo = tamanho mínimo de toque */
    --seg:cubic-bezier(.34,1.56,.64,1);                  /* mola */
    --suave-ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#02040b;color:var(--texto);font-family:var(--sans);overflow:hidden;
    font-size:clamp(12px,1.1vmin + 9.2px,16px);touch-action:manipulation}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible{outline:2px solid var(--gold-light);outline-offset:3px}
  #mapa{position:fixed;inset:0;background:#000;touch-action:none}
  .cesium-viewer-bottom,.cesium-widget-credits{display:none!important}

  /* ---------- VIDRO ---------- */
  .vidro{
    position:relative;isolation:isolate;border-radius:var(--raio);
    background-color:rgba(12,22,48,.10);
    background-image:
      radial-gradient(120% 150% at var(--mx) var(--my),rgba(255,255,255,.26),transparent 46%),
      linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.015) 48%,rgba(255,255,255,.085));
    -webkit-backdrop-filter:blur(12px) saturate(200%) brightness(1.14) contrast(1.04);
            backdrop-filter:blur(12px) saturate(200%) brightness(1.14) contrast(1.04);
    box-shadow:
      inset 0 0 0 .5px rgba(255,255,255,.16),
      inset 1.5px 2px 2px -1px rgba(255,255,255,.7),
      inset -1.5px -2px 2px -1px rgba(255,255,255,.32),
      inset 0 0 26px rgba(255,255,255,.055),
      0 16px 44px rgba(0,0,0,.38),0 2px 8px rgba(0,0,0,.28);
    transition:opacity .35s var(--suave-ease),transform .45s var(--suave-ease),box-shadow .3s;
  }
  /* borda de luz em degradê cônico (brilha nos cantos opostos, como vidro lapidado) */
  .vidro::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;pointer-events:none;z-index:2;
    background:conic-gradient(from 215deg,rgba(255,255,255,.95),rgba(255,255,255,.1) 18%,rgba(255,255,255,.03) 38%,rgba(255,255,255,.55) 62%,rgba(255,255,255,.08) 80%,rgba(255,255,255,.95));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
            mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask-composite:exclude}
  /* reflexo suave no topo + brilho que acompanha o dedo/mouse */
  .vidro::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;mix-blend-mode:screen;
    background:radial-gradient(55% 42% at var(--mx) var(--my),rgba(255,255,255,.34),transparent 72%),
               linear-gradient(180deg,rgba(255,255,255,.12),transparent 26%,transparent 74%,rgba(255,255,255,.07))}
  /* painéis com muito texto: mais corpo para manter a leitura */
  .vidro.denso{background-color:rgba(8,15,36,.36);
    -webkit-backdrop-filter:blur(26px) saturate(190%) brightness(1.05);backdrop-filter:blur(26px) saturate(190%) brightness(1.05)}
  /* lente que distorce o fundo (Chromium); nos outros navegadores fica o vidro fosco acima */
  .lente .vidro:not(.denso){-webkit-backdrop-filter:url(#lente) blur(7px) saturate(210%) brightness(1.16);backdrop-filter:url(#lente) blur(7px) saturate(210%) brightness(1.16)}
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.vidro{background-color:rgba(14,26,56,.9)}}
  @media (prefers-reduced-transparency:reduce){.vidro{background-color:rgba(10,18,40,.92);backdrop-filter:none;-webkit-backdrop-filter:none}}

  /* ---------- Botões ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:var(--alvo);padding:0 1.05em;border-radius:16px;
    background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.05));border:0;font-weight:600;font-size:.97rem;
    box-shadow:inset 0 0 0 .5px rgba(255,255,255,.22),inset 1px 1.5px 1.5px -.5px rgba(255,255,255,.65),inset -1px -1.5px 1.5px -.5px rgba(255,255,255,.2);
    transition:transform .35s var(--seg),background .2s,box-shadow .2s}
  .btn:hover{background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.08))}
  .btn:active{transform:scale(.93)}
  .btn[aria-expanded="true"],.btn.ativo,.btn[aria-pressed="true"]{background:linear-gradient(180deg,rgba(233,212,142,.5),rgba(233,212,142,.16));
    box-shadow:inset 0 0 0 .6px rgba(233,212,142,.85),inset 1px 1.5px 1.5px -.5px rgba(255,255,255,.75),0 0 18px rgba(233,212,142,.28)}
  .btn svg{width:1.25em;height:1.25em;flex:0 0 auto}
  .redondo{width:var(--alvo);height:var(--alvo);min-height:var(--alvo);padding:0;border-radius:50%}
  button.vidro.redondo{border:0}
  button.vidro.redondo:active{transform:scale(.9)}

  /* ---------- Camada da interface (some no modo mapa limpo) ---------- */
  #ui>*{transition:opacity .4s var(--suave-ease),transform .5s var(--suave-ease),visibility 0s}
  body.imersivo #ui>*:not(#creditos){opacity:0;pointer-events:none;visibility:hidden;transition:opacity .35s var(--suave-ease),transform .45s var(--suave-ease),visibility 0s .45s}
  body.imersivo #barra{transform:translateY(-24px) scale(.97)}
  body.imersivo #controles{transform:translateX(30px)}
  body.imersivo #cartao{transform:translateX(-24px)}
  body.imersivo #info,body.imersivo .painel{transform:translateY(30px)}
  body.imersivo #creditos{opacity:.5}

  /* ---------- Barra superior (recolhível) ---------- */
  #barra{position:fixed;z-index:30;left:50%;transform:translateX(-50%);top:calc(var(--gap) + env(safe-area-inset-top));
    width:min(760px,calc(100vw - var(--gap)*2));display:flex;align-items:center;gap:8px;padding:7px 8px 7px 8px;
    transition:width .5s var(--suave-ease),opacity .4s,transform .5s var(--suave-ease)}
  body.imersivo #barra{transform:translate(-50%,-24px) scale(.97)}
  .marca{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
  #btnMenu{flex:0 0 auto;width:var(--alvo);height:var(--alvo);border-radius:50%;padding:0;display:grid;place-items:center;
    background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.04));border:0;
    box-shadow:inset 0 0 0 .5px rgba(255,255,255,.25),inset 1px 1.5px 1.5px -.5px rgba(255,255,255,.7);transition:transform .4s var(--seg)}
  #btnMenu:active{transform:scale(.88) rotate(-12deg)}
  #btnMenu svg{width:60%;height:60%}
  .marca b{font-family:var(--serif);font-size:1.22rem;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .marca b em{font-style:normal;color:var(--gold-light)}
  #barra.recolhida{width:calc(var(--alvo) + 14px);padding:7px}
  #barra.recolhida .marca b,#barra.recolhida>.btn{display:none}
  #barra.recolhida .marca{flex:0 0 auto}

  /* ---------- Cartão do astro ---------- */
  #cartao{position:fixed;z-index:20;left:var(--gap);top:calc(var(--gap) + var(--alvo) + 28px + env(safe-area-inset-top));
    width:min(350px,calc(100vw - var(--gap)*2 - var(--alvo) - 10px));padding:11px 14px;display:flex;gap:12px;align-items:center;cursor:pointer}
  #cartao h2{margin:0;font-family:var(--serif);font-size:1.28rem;line-height:1.15}
  #cartao small{display:block;color:var(--gold-light);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.66rem}
  #cartao p{margin:5px 0 0;color:var(--suave);font-size:.88rem;line-height:1.38}
  #cartao.min p{display:none}
  .esfera{flex:0 0 auto;width:46px;height:46px;border-radius:50%;
    background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.9),var(--c) 42%,#000 135%);
    box-shadow:0 0 20px color-mix(in srgb,var(--c) 55%,transparent),inset -6px -8px 14px rgba(0,0,0,.45)}

  /* ---------- Painéis (catálogo e lugares) ---------- */
  .painel{position:fixed;z-index:40;top:calc(var(--gap) + var(--alvo) + 28px + env(safe-area-inset-top));bottom:calc(var(--gap) + 40px + env(safe-area-inset-bottom));
    width:min(390px,calc(100vw - var(--gap)*2));display:flex;flex-direction:column;overflow:hidden;
    transition:transform .5s var(--suave-ease),opacity .3s,visibility 0s}
  #catalogo{left:var(--gap)} #lista,#camadas{right:var(--gap)}
  .painel[hidden]{display:flex;opacity:0;pointer-events:none;visibility:hidden;transform:translateY(18px) scale(.97);transition:transform .4s var(--suave-ease),opacity .25s,visibility 0s .4s}
  .painel header{padding:12px 18px 6px}
  .painel h3{margin:0;font-family:var(--serif);font-size:1.2rem}
  .painel .corpo{overflow:auto;padding:6px 12px 14px;flex:1;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .painel .topo{padding:0 12px}
  .alca{display:none;width:100%;padding:9px 0 4px;touch-action:none;cursor:grab}
  .alca::after{content:"";display:block;width:42px;height:5px;margin:0 auto;border-radius:3px;background:rgba(255,255,255,.55);box-shadow:0 0 8px rgba(255,255,255,.35)}
  .abas{display:flex;gap:4px;padding:4px;margin:8px 12px 2px;border-radius:16px;background:rgba(0,0,0,.28);box-shadow:inset 0 1px 3px rgba(0,0,0,.4),inset 0 0 0 .5px rgba(255,255,255,.12);overflow-x:auto;scrollbar-width:none}
  .abas::-webkit-scrollbar{display:none}
  .aba{flex:1 0 auto;border:0;background:transparent;border-radius:12px;padding:9px 12px;min-height:38px;font-weight:600;font-size:.84rem;color:var(--suave);white-space:nowrap;transition:background .2s,color .2s}
  .aba[aria-selected="true"]{background:linear-gradient(180deg,rgba(233,212,142,.42),rgba(233,212,142,.16));color:#fff;box-shadow:inset 0 0 0 .5px rgba(233,212,142,.7),inset 1px 1.5px 1.5px -.5px rgba(255,255,255,.7)}
  .item{width:100%;display:flex;align-items:center;gap:12px;text-align:left;margin:6px 0 0;padding:10px 12px;border-radius:16px;min-height:calc(var(--alvo) + 8px);
    background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:0;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.16),inset 1px 1.5px 1.5px -.5px rgba(255,255,255,.4);
    transition:transform .35s var(--seg),background .2s}
  .item:hover{background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.06))}
  .item:active{transform:scale(.97)}
  .item[aria-current="true"]{box-shadow:inset 0 0 0 1px var(--gold-light),inset 1px 1.5px 1.5px -.5px rgba(255,255,255,.6),0 0 20px rgba(233,212,142,.22)}
  .item .esfera{width:34px;height:34px}
  .item b{display:block;font-size:1.02rem}
  .item span.sub{display:block;color:var(--suave);font-size:.8rem}
  .rotulo{margin:14px 6px 2px;color:var(--gold-light);font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
  .pino{flex:0 0 auto;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:.82rem;color:#101010;box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 2px 6px rgba(0,0,0,.3)}
  .vazio{color:var(--suave);padding:14px 8px;font-size:.92rem}

  /* ---------- Interruptor e filtros de alfinetes ---------- */
  .interruptor{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin:2px 0 0;padding:12px 14px;border-radius:16px;border:0;text-align:left;
    background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03));box-shadow:inset 0 0 0 .5px rgba(255,255,255,.16),inset 1px 1.5px 1.5px -.5px rgba(255,255,255,.4)}
  .interruptor b{display:block;font-size:.98rem}
  .interruptor span.sub{display:block;color:var(--suave);font-size:.78rem;margin-top:1px}
  .chave{flex:0 0 auto;width:52px;height:30px;border-radius:15px;position:relative;background:rgba(0,0,0,.35);box-shadow:inset 0 1px 3px rgba(0,0,0,.5),inset 0 0 0 .5px rgba(255,255,255,.2);transition:background .25s}
  .chave::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;
    background:linear-gradient(180deg,#fff,#d9e2f4);box-shadow:0 2px 8px rgba(0,0,0,.45),inset 0 -2px 3px rgba(0,0,0,.12);transition:transform .35s var(--seg),width .2s}
  .interruptor:active .chave::after{width:32px}
  .interruptor[aria-pressed="true"] .chave{background:linear-gradient(180deg,rgba(233,212,142,.85),rgba(201,162,39,.8))}
  .interruptor[aria-pressed="true"] .chave::after{transform:translateX(22px)}
  .interruptor[aria-pressed="true"]:active .chave::after{transform:translateX(16px)}
  .filtros{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
  .filtros[hidden]{display:none}
  .filtro{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 12px 0 8px;border-radius:12px;font-size:.82rem;font-weight:600;color:var(--suave);border:0;
    background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02));box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18);transition:transform .3s var(--seg)}
  .filtro:active{transform:scale(.94)}
  .filtro .pino{width:20px;height:20px;border-radius:7px;font-size:.66rem;opacity:.4}
  .filtro[aria-pressed="true"]{color:#fff;box-shadow:inset 0 0 0 .8px rgba(233,212,142,.8),inset 1px 1.5px 1.5px -.5px rgba(255,255,255,.5);background:linear-gradient(180deg,rgba(233,212,142,.3),rgba(233,212,142,.08))}
  .filtro[aria-pressed="true"] .pino{opacity:1}

  /* ---------- Painel de informações ---------- */
  #info{position:fixed;z-index:35;left:var(--gap);right:var(--gap);bottom:calc(var(--gap) + 40px + env(safe-area-inset-bottom));max-height:52vh;overflow:auto;padding:0 18px 18px;
    overscroll-behavior:contain;transition:transform .5s var(--suave-ease),opacity .3s,max-height .4s var(--suave-ease)}
  #info[hidden]{display:none}
  #info.min{max-height:calc(var(--alvo) + 74px);overflow:hidden}
  #info.min dl,#info.min .curiosidade,#info.min .acoes{display:none}
  #info h2{margin:2px 56px 8px 0;font-family:var(--serif);font-size:1.45rem;line-height:1.15}
  #fechar{position:absolute;top:10px;right:10px;z-index:3}
  .tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;padding:3px 10px;border-radius:9px;color:#101010;box-shadow:inset 0 1px 1px rgba(255,255,255,.6)}
  dl{margin:12px 0 0;display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:.96rem}
  dt{color:var(--suave)} dd{margin:0;font-weight:500}
  .curiosidade{margin:14px 0 0;padding:12px 14px;background:linear-gradient(180deg,rgba(233,212,142,.14),rgba(233,212,142,.05));border-radius:14px;line-height:1.5;
    box-shadow:inset 3px 0 0 var(--gold-light),inset 0 0 0 .5px rgba(233,212,142,.3)}
  .acoes{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
  .vivo{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;letter-spacing:.1em;color:#5eead4}
  .vivo[hidden]{display:none}
  .vivo::before{content:"";width:8px;height:8px;border-radius:50%;background:#5eead4;box-shadow:0 0 0 0 #5eead4aa;animation:pulso 1.6s infinite}
  @keyframes pulso{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}

  #iImg{display:block;width:100%;max-height:170px;object-fit:cover;border-radius:16px;margin:4px 0 10px;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.3),0 6px 18px rgba(0,0,0,.35)}
  #iImg[hidden]{display:none}
  .campo{width:100%;min-height:var(--alvo);padding:0 14px;margin-top:8px;border-radius:14px;border:0;color:var(--texto);font:inherit;font-size:.92rem;
    background:rgba(0,0,0,.3);box-shadow:inset 0 1px 3px rgba(0,0,0,.5),inset 0 0 0 .5px rgba(255,255,255,.2)}
  .campo::placeholder{color:var(--suave)}
  details.sobre{margin:14px 6px 4px;color:var(--suave);font-size:.84rem;line-height:1.5}
  details.sobre summary{cursor:pointer;font-weight:600;color:var(--gold-light);padding:6px 0}
  .linha-acoes{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 0}
  .item .pino.ok{background:var(--gold-light)}
  .nota{margin:6px 6px 0;color:var(--suave);font-size:.8rem}

  /* ---------- Visor de objetos 3D ---------- */
  #visor{position:fixed;z-index:50;left:var(--gap);right:var(--gap);top:calc(var(--gap) + var(--alvo) + 28px + env(safe-area-inset-top));bottom:calc(var(--gap) + 40px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;overflow:hidden;transition:transform .5s var(--suave-ease),opacity .3s,visibility 0s}
  #visor[hidden]{display:flex;opacity:0;pointer-events:none;visibility:hidden;transform:translateY(22px) scale(.97);transition:transform .4s var(--suave-ease),opacity .25s,visibility 0s .4s}
  .vtopo{display:flex;align-items:center;gap:12px;padding:10px 12px 8px 18px}
  .vtopo h3{margin:0;font-family:var(--serif);font-size:1.25rem;white-space:nowrap}
  .vtopo .abas{flex:1;margin:0;min-width:0}
  .vcorpo{flex:1;min-height:0;display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:12px;padding:0 12px 12px}
  .vlado{order:-1;overflow:auto;min-height:0;overscroll-behavior:contain;padding-right:2px}
  .vpalco{position:relative;min-height:0;border-radius:20px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#1b2c57,#060b1a 75%);
    box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18),inset 0 12px 40px rgba(0,0,0,.35)}
  #vPalco model-viewer,#vThree,#vSketch{position:absolute;inset:0;width:100%;height:100%;border:0;--poster-color:transparent;background:transparent}
  #vThree[hidden],#vSketch[hidden],.vvazio[hidden],#vPalco model-viewer[hidden]{display:none!important}
  .vvazio{position:absolute;inset:0;display:grid;place-content:center;gap:6px;text-align:center;padding:24px;color:var(--suave)}
  .vvazio b{font-family:var(--serif);font-size:1.3rem;color:#fff}
  .vbarra{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px;border-radius:20px;z-index:3}
  .vbarra[hidden],.vinfo[hidden]{display:none}
  .vbarra .btn{min-height:38px;padding:0 12px;font-size:.84rem;border-radius:13px}
  .vbarra select{min-height:38px;border-radius:13px;border:0;padding:0 10px;color:var(--texto);font:inherit;font-size:.84rem;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.25)}
  .vbarra select option{color:#000}
  .vinfo{position:absolute;left:10px;top:10px;max-width:calc(100% - 20px);padding:9px 14px;border-radius:16px;z-index:3;font-size:.84rem;line-height:1.4}
  .vinfo b{font-family:var(--serif);font-size:1.02rem;display:block}
  .vinfo small{color:var(--suave)}
  .vinfo a{color:var(--gold-light)}
  .cartoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}

<script>
"use strict";
/* =====================================================================
   MAPA DOS ASTROS
   Um objeto por astro em ASTROS. Para incluir outro, copie um bloco.
   - raios: semieixos [x,y,z] em metros (o Cesium só desenha esferas e elipsoides de revolução, como a Terra)
   - forma: (opcional) formato 3 eixos desenhado como objeto 3D, para asteroides alongados como Eros
   - fontes: de onde vêm as imagens; o app testa uma a uma e usa a primeira que responder
   - lugares: marcadores (lat/lon em graus; +N/−S, +L/−O); alcance = distância da câmera em km
   ===================================================================== */

/* ---------- Categorias ---------- */
const CATEGORIAS = [
  { id: "planetas", nome: "Planetas" },
  { id: "luas",     nome: "Luas" },
  { id: "anoes",    nome: "Anões e asteroides" },
  { id: "estacoes", nome: "Estações" }
];

/* ---------- Tipos de lugar ---------- */
const TIPOS = {
  pouso:      { rotulo: "Local de pouso",         cor: "#ffd166", letra: "P" },
  planicie:   { rotulo: "Planície / bacia",       cor: "#6cb6ff", letra: "M" },
  cratera:    { rotulo: "Cratera de impacto",     cor: "#ff8f6b", letra: "C" },
  relevo:     { rotulo: "Vulcão / vale / relevo", cor: "#7ee0a1", letra: "R" },
  lancamento: { rotulo: "Base de lançamento",     cor: "#c4a3ff", letra: "B" },
  cidade:     { rotulo: "Cidade",                 cor: "#f4f4f4", letra: "★" },
  estacao:    { rotulo: "Estação espacial",       cor: "#5eead4", letra: "S" },
  wiki:       { rotulo: "Artigo da Wikipédia",    cor: "#ffffff", letra: "W" }
};

/* ---------- Fontes de imagem ----------
   trek : NASA Solar System Treks (WMTS)    gibs : NASA GIBS (Terra)
   natural : Natural Earth, incluído no Cesium   wms : USGS Astrogeology (descobre a camada sozinho) */
const wmsUsgs = (...mapas) => ({ t: "wms", urls: mapas.map(m => `https://planetarymaps.usgs.gov/cgi-bin/mapserv?map=/maps/${m}.map`),
  credito: "Mapas: USGS Astrogeology Science Center / NASA", rotulo: "USGS Astrogeology", desc: "Mapas planetários do serviço geológico dos EUA" });
const trek = (pasta, nome, ext, credito) => ({ t: "trek", pasta, nome, ext, credito,

/* =====================================================================
   IMAGENS DE SUPERFÍCIE
   O app testa cada fonte da lista; a primeira que responde é usada.
   Se nenhuma responder, mostra o astro em modelo 3D simplificado (cor + sombra).
   ===================================================================== */
const BASE_TREK = "https://trek.nasa.gov/tiles";
const filho = (el, nome) => Array.from(el.children).find(c => c.localName === nome) || null;
const comTempo = (ms, fn) => { const c = new AbortController(); const t = setTimeout(() => c.abort(), ms); return fn(c.signal).finally(() => clearTimeout(t)); };

function testarImagem(url, ms = 9000){
  return new Promise(ok => {
    const img = new Image(); img.crossOrigin = "anonymous";
    const t = setTimeout(() => ok(false), ms);
    img.onload = () => { clearTimeout(t); ok(true); };
    img.onerror = () => { clearTimeout(t); ok(false); };
    img.src = url;
  });
}
const sub = (modelo, cfg, z = 0, r = 0, c = 0) => modelo.replace(/\{style\}/i, cfg.estilo).replace("{TileMatrixSet}", cfg.conjunto)
  .replace("{TileMatrix}", cfg.rotulos[z]).replace("{TileRow}", r).replace("{TileCol}", c);

/* --- NASA Trek: lê o GetCapabilities (ou usa o padrão conhecido) --- */
async function lerCapabilitiesWmts(url){
  try{
    const r = await comTempo(8000, s => fetch(url, {signal: s})); if (!r.ok) return null;
    const xml = new DOMParser().parseFromString(await r.text(), "application/xml");
    const g = n => Array.from(xml.getElementsByTagNameNS("*", n));
    const res = g("ResourceURL").find(e => e.getAttribute("resourceType") === "tile");
    const conj = g("TileMatrixSet").find(e => filho(e, "TileMatrix"));
    if (!res || !conj) return null;
    const ms = Array.from(conj.children).filter(c => c.localName === "TileMatrix");
    const est = g("Style").map(e => filho(e, "Identifier")).find(Boolean);
    return { modelo: res.getAttribute("template"), estilo: est ? est.textContent.trim() : "default",
      conjunto: filho(conj, "Identifier").textContent.trim(), rotulos: ms.map(m => filho(m, "Identifier").textContent.trim()),
      w0: +filho(ms[0], "MatrixWidth").textContent, h0: +filho(ms[0], "MatrixHeight").textContent, tile: 256 };
  }catch(e){ return null; }
}
async function prepararTrek(f){
  const cfg = (await lerCapabilitiesWmts(`${BASE_TREK}/${f.pasta}/EQ/${f.nome}/1.0.0/WMTSCapabilities.xml`)) || {
    modelo: `${BASE_TREK}/${f.pasta}/EQ/${f.nome}/1.0.0/{Style}/{TileMatrixSet}/{TileMatrix}/{TileRow}/{TileCol}.${f.ext}`,
    estilo: "default", conjunto: "default028mm", rotulos: ["0","1","2","3","4","5","6","7"], w0: 2, h0: 1, tile: 256 };
  return (await testarImagem(sub(cfg.modelo, cfg))) ? cfg : null;
}
/* --- NASA GIBS (Blue Marble) --- */
async function prepararGibs(){
  const cfg = { modelo: "https://gibs.earthdata.nasa.gov/wmts/epsg4326/best/BlueMarble_ShadedRelief_Bathymetry/default/{TileMatrixSet}/{TileMatrix}/{TileRow}/{TileCol}.jpeg",
    estilo: "default", conjunto: "500m", rotulos: ["0","1","2","3","4","5","6","7","8"], w0: 2, h0: 1, tile: 512 };
  return (await testarImagem(sub(cfg.modelo, cfg))) ? cfg : null;
}
function provedorWmts(cfg, elip, credito){
  return new Cesium.WebMapTileServiceImageryProvider({
    url: cfg.modelo, layer: "x", style: cfg.estilo, format: "image/jpeg", tileMatrixSetID: cfg.conjunto,
    tileMatrixLabels: cfg.rotulos, maximumLevel: cfg.rotulos.length - 1, tileWidth: cfg.tile, tileHeight: cfg.tile,
    tilingScheme: new Cesium.GeographicTilingScheme({ellipsoid: elip, numberOfLevelZeroTilesX: cfg.w0, numberOfLevelZeroTilesY: cfg.h0}),
    credit: credito });
}
/* --- USGS Astrogeology (WMS): descobre a camada pelo GetCapabilities e testa um GetMap --- */
async function tentarWms(url){
  try{
    const sep = url.includes("?") ? "&" : "?";
    const r = await comTempo(8000, s => fetch(`${url}${sep}SERVICE=WMS&VERSION=1.1.1&REQUEST=GetCapabilities`, {signal: s})); if (!r.ok) return null;
    const xml = new DOMParser().parseFromString(await r.text(), "application/xml");
    const nomes = Array.from(xml.getElementsByTagName("Layer")).map(l => filho(l, "Name")).filter(Boolean).map(n => n.textContent.trim());
    const bom = nomes.filter(n => !/graticule|label|nomenclature|grid|footprint|feature/i.test(n));
    const camada = bom.find(n => /mosaic|global|basemap|color|clr|shade|simp/i.test(n)) || bom[0];
    if (!camada) return null;
    const teste = `${url}${sep}SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS=${encodeURIComponent(camada)}&STYLES=&SRS=EPSG:4326&BBOX=-180,-90,180,90&WIDTH=512&HEIGHT=256&FORMAT=image/jpeg`;
    return (await testarImagem(teste)) ? {url, camada} : null;
  }catch(e){ return null; }
}
const primeiro = ps => new Promise(ok => { let n = ps.length; if (!n) ok(null); ps.forEach(p => p.then(v => { if (v) ok(v); else if (--n === 0) ok(null); })); });

/* Textura de rocha gerada no navegador (asteroides sem mapa): ruído + crateras */
function texturaRocha(cor){
  const c = document.createElement("canvas"); c.width = 1024; c.height = 512; const g = c.getContext("2d");
  g.fillStyle = cor; g.fillRect(0, 0, 1024, 512);
  let x = 12345; const rnd = () => (x = (x * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 9000; i++){ g.fillStyle = `rgba(${rnd() < .5 ? "0,0,0" : "255,255,255"},${(rnd() * .09).toFixed(3)})`; g.fillRect(rnd() * 1024, rnd() * 512, 1 + rnd() * 5, 1 + rnd() * 5); }
  for (let i = 0; i < 140; i++){ const cx = rnd() * 1024, cy = rnd() * 512, r = 4 + rnd() * rnd() * 46;
    g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fillStyle = "rgba(0,0,0,.20)"; g.fill();
    g.beginPath(); g.arc(cx - r * .12, cy - r * .12, r * .88, 0, 7); g.fillStyle = "rgba(255,255,255,.07)"; g.fill();
    g.beginPath(); g.arc(cx, cy, r, 0, 7); g.strokeStyle = "rgba(255,255,255,.18)"; g.lineWidth = 1.2; g.stroke(); }
  return c.toDataURL("image/jpeg", .85);
}

/* Cria o provedor de imagens de uma fonte (testando antes se ela responde); null se não funcionar */
async function criarProvedor(f, elip){
  if (f.t === "xyz"){
    const teste = f.url.replace("{s}", f.sub ? f.sub[0] : "").replace("{z}", 2).replace("{x}", 1).replace("{y}", 1);
    if (!(await testarImagem(teste))) return null;
    return new Cesium.UrlTemplateImageryProvider({ url: f.url, subdomains: f.sub, maximumLevel: f.nivelMax, credit: f.credito, tileWidth: 256, tileHeight: 256,
      tilingScheme: new Cesium.WebMercatorTilingScheme({ellipsoid: elip}) });
  }
  if (f.t === "trek"){ const cfg = await prepararTrek(f); return cfg ? provedorWmts(cfg, elip, f.credito) : null; }
  if (f.t === "gibs"){ const cfg = await prepararGibs(); return cfg ? provedorWmts(cfg, elip, f.credito) : null; }
  if (f.t === "natural"){
    try{ return await Cesium.TileMapServiceImageryProvider.fromUrl(Cesium.buildModuleUrl("Assets/Textures/NaturalEarthII"), {credit: f.credito}); }catch(e){ return null; }
  }
  if (f.t === "wms"){
    const ok = await primeiro(f.urls.map(tentarWms)); if (!ok) return null;
    return new Cesium.WebMapServiceImageryProvider({ url: ok.url, layers: ok.camada, parameters: {format: "image/jpeg", transparent: false, styles: ""},
      tilingScheme: new Cesium.GeographicTilingScheme({ellipsoid: elip}), tileWidth: 256, tileHeight: 256, credit: f.credito });
  }
  return null;
}
/* Troca a camada de baixo (mapa-base) mantendo as camadas por cima */
let camadaBase = null, fonteAtual = null, fonteEstado = {};     // fonteEstado[id] = "ok" | "falhou"
function usarProvedor(f, p){
  if (camadaBase) viewer.imageryLayers.remove(camadaBase, true);
  camadaBase = viewer.imageryLayers.addImageryProvider(p, 0); fonteAtual = f; atualizarCreditos(); viewer.scene.requestRender();
}
async function colocarFonte(f, minhaSeq){
  const p = await criarProvedor(f, Cesium.Ellipsoid.default).catch(() => null);
  if (minhaSeq !== seq) return "cancelado";
  fonteEstado[f.id] = p ? "ok" : "falhou";
  if (!p) return null;
  usarProvedor(f, p); return f;
}
/* Usa a fonte escolhida pela pessoa; senão (ou se falhar) testa TODAS ao mesmo tempo e fica com a primeira da lista que responder (a mais detalhada) */
async function escolherFonte(a, minhaSeq, preferida){
  if (preferida){
    const f = a.fontes.find(x => x.id === preferida);
    if (f){ const r = await colocarFonte(f, minhaSeq); if (r === "cancelado") return r; if (r) return r;
      avisar("A fonte escolhida não respondeu agora; usei a mais detalhada disponível."); }
  }
  const elip = Cesium.Ellipsoid.default;
  const res = await Promise.all(a.fontes.map(f => criarProvedor(f, elip).catch(() => null)));
  if (minhaSeq !== seq) return "cancelado";
  a.fontes.forEach((f, i) => { fonteEstado[f.id] = res[i] ? "ok" : "falhou"; });
  const i = res.findIndex(Boolean); if (i < 0) return null;
  usarProvedor(a.fontes[i], res[i]); return a.fontes[i];
}

/* Créditos: fonte do mapa + camadas e recursos ligados (exigência das licenças) */
function atualizarCreditos(){
  const t = [];
  if (fonteAtual && fonteAtual.credito) t.push(fonteAtual.credito);
  else if (astro && astro.formaApenas) t.push("Forma aproximada (sem mapa de superfície)");
  else if (astro && astro.fontes && astro.fontes.length && Object.keys(fonteEstado).length) t.push("Mapa de superfície indisponível no momento");
  if (astro && astro.terra){

    if (wikiPins.length) t.push("Artigos: Wikipédia (CC BY-SA)");

  $("creditoImagem").textContent = t.length ? t.join(" · ") : "";
}

function alturaInicio(){
  const c = viewer.canvas, asp = c.clientWidth / Math.max(1, c.clientHeight);
  const metade = Math.atan(Math.tan(viewer.camera.frustum.fov / 2) * Math.min(asp, 1 / asp));
  const R = raioMax(astro);
  return R * (1.22 / Math.sin(metade) - 1);
}
function visaoInicial(animar){
  const destino = Cesium.Cartesian3.fromDegrees(astro.lonInicial || 0, 0, alturaInicio());
  const orient = {heading: 0, pitch: -Cesium.Math.PI_OVER_TWO, roll: 0};
  if (animar) viewer.camera.flyTo({destination: destino, orientation: orient, duration: 2});
  else viewer.camera.setView({destination: destino, orientation: orient});
}
function voarPara(l){
  const pos = Cesium.Cartesian3.fromDegrees(l.lon, l.lat, 0);
  viewer.trackedEntity = undefined;
  viewer.camera.flyToBoundingSphere(new Cesium.BoundingSphere(pos, 1), {
    offset: new Cesium.HeadingPitchRange(0, -Cesium.Math.PI_OVER_TWO, l.alcance * 1000), duration: 2.5 });
}
function zoom(fator){
  /* fator 0.5 aproxima (metade da altura), 2 afasta (dobro) */
  const cam = viewer.camera, R = raioMax(astro);
  const h = Math.max(1, cam.getMagnitude() - R);
  const alvo = Math.min(R * 8, Math.max(R * 0.012, h * fator));
  if (fator < 1) cam.zoomIn(h - alvo); else cam.zoomOut(alvo - h);
  viewer.scene.requestRender();
}

/* Mostra/oculta os alfinetes conforme o interruptor e os filtros; o lugar selecionado sempre aparece */
function aplicarPinos(){
  if (!viewer || !astro) return;
  for (const l of astro.lugares) if (l.entidade) l.entidade.show = (pinosOn && tiposOn.has(l.tipo)) || l.entidade === entidadeSel;
  const b = $("btnPinos"); b.setAttribute("aria-pressed", String(pinosOn)); b.classList.toggle("ativo", pinosOn);
  b.title = "Alfinetes de referência (" + (pinosOn ? "ligados" : "desligados") + ")";
  $("chavePinos").setAttribute("aria-pressed", String(pinosOn));
  $("pinosSub").textContent = pinosOn ? "Ligados. Use os filtros para escolher os tipos." : "Desligados. Toque num lugar da lista para ver só ele.";
  montarFiltros(); viewer.scene.requestRender();
}
function montarFiltros(){

/* =====================================================================
   ISS AO VIVO (API pública wheretheiss.at)
   ===================================================================== */
const API_ISS = "https://api.wheretheiss.at/v1/satellites/25544";
const ISS_LUGAR = { nome:"Estação Espacial Internacional (ISS)", tipo:"estacao", vivo:true, lat:0, lon:0,
  tamanho:"Cerca de 109 m de ponta a ponta, como um campo de futebol",
  curiosidade:"Ela viaja a quase 28.000 km/h e dá cerca de 16 voltas na Terra por dia. Os astronautas veem o nascer do sol a cada 90 minutos!" };

async function lerISS(){
  try{ const r = await comTempo(6000, s => fetch(API_ISS, {signal: s})); if (!r.ok) return null; return await r.json(); }catch(e){ return null; }
}
async function lerOrbitaISS(t0){
  /* 3 chamadas × 10 pontos = 30 posições (próximos ~90 min) para desenhar a órbita prevista */
  const pts = [];
  for (let k = 0; k < 3; k++){
    const ts = Array.from({length: 10}, (_, i) => t0 + (k * 10 + i) * 180).join(",");
    try{ const r = await comTempo(7000, s => fetch(`${API_ISS}/positions?units=kilometers&timestamps=${ts}`, {signal: s}));
      if (r.ok) (await r.json()).forEach(p => pts.push(p)); }catch(e){}
  }
  return pts;
}
async function iniciarISS(minhaSeq){
  const d = await lerISS();
  if (minhaSeq !== seq) return;
  if (!d){ avisar("Não foi possível obter a posição ao vivo da ISS agora. Tente novamente em instantes."); return; }
  ISS_LUGAR.lat = d.latitude; ISS_LUGAR.lon = d.longitude;
  const pos = Cesium.Cartesian3.fromDegrees(d.longitude, d.latitude, d.altitude * 1000);
  issRastro = [];
  issEnt = viewer.entities.add({ name: "ISS", position: pos,
    billboard: { image: IMG_ISS, width: 46, height: 46, disableDepthTestDistance: Number.POSITIVE_INFINITY },
    label: { text: "ISS", font: "700 14px 'Source Sans 3',sans-serif", fillColor: Cesium.Color.fromCssColorString("#5eead4"),
      outlineColor: Cesium.Color.BLACK, outlineWidth: 4, style: Cesium.LabelStyle.FILL_AND_OUTLINE,
      pixelOffset: new Cesium.Cartesian2(0, -34), disableDepthTestDistance: Number.POSITIVE_INFINITY },
    polyline: { positions: [], width: 2.5, material: Cesium.Color.fromCssColorString("#5eead4").withAlpha(.9) } });
  ISS_LUGAR.entidade = issEnt; issEnt._lugar = ISS_LUGAR;
  const prev = viewer.entities.add({ name: "Órbita prevista", polyline: { positions: [], width: 1.6,
    material: new Cesium.PolylineDashMaterialProperty({color: Cesium.Color.fromCssColorString("#E9D48E").withAlpha(.85), dashLength: 14}) } });
  atualizarISS(d);
  clearInterval(issTimer); issTimer = setInterval(async () => { const n = await lerISS(); if (n && viewer) atualizarISS(n); }, 5000);
  lerOrbitaISS(Math.floor(d.timestamp)).then(ps => {
    if (minhaSeq !== seq || !viewer) return;
    prev.polyline.positions = ps.map(p => Cesium.Cartesian3.fromDegrees(p.longitude, p.latitude, p.altitude * 1000));
    viewer.scene.requestRender();
  });
}
function atualizarISS(d){
  ISS_LUGAR.lat = d.latitude; ISS_LUGAR.lon = d.longitude;
  const pos = Cesium.Cartesian3.fromDegrees(d.longitude, d.latitude, d.altitude * 1000);
  issEnt.position = pos; issRastro.push(pos); if (issRastro.length > 120) issRastro.shift();

  if (!issEnt) return;

}

/* =====================================================================
   RELEVO 3D (AWS Terrain Tiles, formato Terrarium) — só na Terra
   ===================================================================== */
const TERRARIUM = "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png";
const cacheAlt = new Map();
const carregarImg = url => new Promise((ok, err) => { const i = new Image(); i.crossOrigin = "anonymous"; i.onload = () => ok(i); i.onerror = err; i.src = url; });
function dadosTerrarium(z, x, y){
  const k = z + "/" + x + "/" + y; if (cacheAlt.has(k)) return cacheAlt.get(k);
  const pr = carregarImg(TERRARIUM.replace("{z}", z).replace("{x}", x).replace("{y}", y)).then(img => {
    const c = document.createElement("canvas"); c.width = img.width; c.height = img.height;
    const g = c.getContext("2d", {willReadFrequently: true}); g.drawImage(img, 0, 0);
    return {d: g.getImageData(0, 0, c.width, c.height).data, w: c.width, h: c.height};
  });
  cacheAlt.set(k, pr); if (cacheAlt.size > 300) cacheAlt.delete(cacheAlt.keys().next().value);
  return pr;
}
/* Grade 65×65 de alturas (m) de um bloco; abaixo do nível do mar fica 0 (oceano plano) */
async function alturasTile(x, y, nivel){
  const zz = Math.min(nivel, 13), sh = nivel - zz, px = x >> sh, py = y >> sh;
  const out = new Float32Array(65 * 65);
  let t; try{ t = await dadosTerrarium(zz, px, py); }catch(e){ return out; }
  const n = 1 << sh, ox = (x - (px << sh)) / n, oy = (y - (py << sh)) / n, esc = 1 / n;
  const h = (a, b) => { const k = (b * t.w + a) * 4; return Math.max(0, t.d[k] * 256 + t.d[k + 1] + t.d[k + 2] / 256 - 32768); };
  for (let j = 0; j < 65; j++) for (let i = 0; i < 65; i++){
    const u = (ox + esc * i / 64) * (t.w - 1), v = (oy + esc * j / 64) * (t.h - 1);
    const x0 = Math.floor(u), y0 = Math.floor(v), x1 = Math.min(x0 + 1, t.w - 1), y1 = Math.min(y0 + 1, t.h - 1), fx = u - x0, fy = v - y0;
    out[j * 65 + i] = h(x0, y0) * (1 - fx) * (1 - fy) + h(x1, y0) * fx * (1 - fy) + h(x0, y1) * (1 - fx) * fy + h(x1, y1) * fx * fy;
  }
  return out;
}
function ligarRelevo(on){
  relevoOn = on; guardar("mapa.relevo", on ? "1" : "0");
  if (viewer && astro.terra){
    const g = viewer.scene.globe;
    g.terrainProvider = on ? new Cesium.CustomHeightmapTerrainProvider({ callback: (x, y, l) => alturasTile(x, y, l), width: 65, height: 65,
      tilingScheme: new Cesium.WebMercatorTilingScheme({ellipsoid: Cesium.Ellipsoid.default}), ellipsoid: Cesium.Ellipsoid.default }) : new Cesium.EllipsoidTerrainProvider();
    viewer.scene.verticalExaggeration = on ? 1.6 : 1; g.depthTestAgainstTerrain = on;
    viewer.scene.requestRender();
  }

}

/* =====================================================================
   PRÉDIOS EM 3D (OpenStreetMap via Overpass) — só perto do chão, na Terra
   ===================================================================== */
const OVERPASS = ["https://overpass-api.de/api/interpreter", "https://overpass.kumi.systems/api/interpreter"];
let predioTimer = null, predioIds = new Set();
function ligarPredios(on){
  prediosOn = on; guardar("mapa.predios", on ? "1" : "0");
  if (viewer && astro.terra){
    if (on){
      if (!srcPredios){ srcPredios = new Cesium.CustomDataSource("predios"); viewer.dataSources.add(srcPredios); predioIds = new Set();
        viewer.camera.moveEnd.addEventListener(agendarPredios); }
      srcPredios.show = true; agendarPredios();
    } else if (srcPredios) srcPredios.show = false;
  }
  atualizarCreditos();
}
function agendarPredios(){ clearTimeout(predioTimer); predioTimer = setTimeout(carregarPredios, 700); }
async function carregarPredios(){
  if (!prediosOn || !viewer || !astro.terra || !srcPredios) return;
  const alt = viewer.camera.positionCartographic.height;
  if (alt > 3500){ avisar("Aproxime-se (menos de 3,5 km de altura) para ver os prédios em 3D."); return; }
  avisar("");
  let r = viewer.camera.computeViewRectangle(); const D = Cesium.Math.toDegrees;
  const c = viewer.camera.positionCartographic;
  if (!r) r = new Cesium.Rectangle(c.longitude - .004, c.latitude - .004, c.longitude + .004, c.latitude + .004);
  let s = D(r.south), n = D(r.north), w = D(r.west), e = D(r.east), mLat = (s + n) / 2, mLon = (w + e) / 2;
  if (n - s > .03){ s = mLat - .015; n = mLat + .015; } if (e - w > .03){ w = mLon - .015; e = mLon + .015; }
  const q = `[out:json][timeout:25];way["building"](${s.toFixed(5)},${w.toFixed(5)},${n.toFixed(5)},${e.toFixed(5)});out geom 1800;`;
  let dados = null;
  for (const url of OVERPASS){
    try{ const resp = await comTempo(25000, sg => fetch(url, {method: "POST", body: "data=" + encodeURIComponent(q), signal: sg}));
      if (resp.ok){ dados = await resp.json(); break; } }catch(err){}
  }
  if (!dados || !prediosOn || !viewer){ if (!dados) avisar("Não consegui carregar os prédios agora (servidor do OpenStreetMap ocupado)."); return; }
  if (predioIds.size > 2500){ srcPredios.entities.removeAll(); predioIds.clear(); }
  for (const el of dados.elements || []){
    if (!el.geometry || el.geometry.length < 4 || predioIds.has(el.id)) continue;
    predioIds.add(el.id);
    const t = el.tags || {};
    let h = parseFloat(String(t.height || "").replace(",", ".")); if (!(h > 0)) h = parseFloat(t["building:levels"]) * 3.2;
    if (!(h > 0)) h = /house|garage|shed|hut|cabin/.test(t.building || "") ? 5 : 9;
    const cor = h < 10 ? "#f3e8d4" : h < 30 ? "#d4e4fa" : "#a9c8ff";
    const pts = el.geometry.slice(0, -1).flatMap(g => [g.lon, g.lat]);
    srcPredios.entities.add({ polygon: { hierarchy: new Cesium.PolygonHierarchy(Cesium.Cartesian3.fromDegreesArray(pts)),
      height: 0, heightReference: Cesium.HeightReference.RELATIVE_TO_GROUND, extrudedHeight: h, extrudedHeightReference: Cesium.HeightReference.RELATIVE_TO_GROUND,
      material: Cesium.Color.fromCssColorString(cor).withAlpha(.93), outline: true, outlineColor: Cesium.Color.fromCssColorString("#55627d").withAlpha(.6) } });
  }
  viewer.scene.requestRender();
}

/* =====================================================================

async function ligarGoogle(on){

  if (!c){ avisar("Aponte o mapa para a superfície da Terra e tente de novo."); return; }

    const r = await comTempo(10000, sg => fetch(u, {signal: sg})); const j = await r.json();

      l.entidade._lugar = l; wikiPins.push(l);

  b.appendChild(botao("Aramado", e => { let on = false; raiz.traverse(o => { if (o.material){ o.material.wireframe = !o.material.wireframe; on = o.material.wireframe; } }); e.target.setAttribute("aria-pressed", String(on)); }));
  b.appendChild(botao("Recentralizar", () => { c.cam.position.set(2.8, 2.2, 3.4); c.ctl.target.set(0, raiz.position.y, 0); c.ctl.update(); }));
  b.appendChild(botao("Tela cheia", () => { const p = $("vPalco"); document.fullscreenElement ? document.exitFullscreen() : (p.requestFullscreen && p.requestFullscreen()); }));
}
async function abrirArquivo(nomeArq, dados, tipo){      // dados: ArrayBuffer (stl) | string (obj)
  const ext = nomeArq.toLowerCase().split(".").pop().split("?")[0];
  try{
    const {THREE, STLLoader, OBJLoader} = await garantirThree();
    const mat = new THREE.MeshStandardMaterial({color: 0xc9d6ee, metalness: .15, roughness: .5, side: THREE.DoubleSide});
    if (ext === "stl"){ const geo = new STLLoader().parse(dados); geo.computeVertexNormals(); await mostrarMalha(new THREE.Mesh(geo, mat), nomeArq, [], geo); }
    else { const g = new OBJLoader().parse(dados); g.traverse(o => { if (o.isMesh) o.material = mat; }); await mostrarMalha(g, nomeArq, []); }
  }catch(e){ console.error(e); infoPalco(nomeArq, ["Não consegui abrir este arquivo."]); $("vInfo").hidden = false; }
}
async function abrirPorEndereco(url){
  url = url.trim(); if (!url) return;
  const ext = url.toLowerCase().split("?")[0].split("#")[0].split(".").pop(), nome = decodeURIComponent(url.split("/").pop().split("?")[0] || "modelo");
  if (ext === "glb" || ext === "gltf") return mostrarGlb(url, nome, "Fonte: " + new URL(url).host);
  if (ext === "stl" || ext === "obj"){
    try{ const r = await fetch(url); if (!r.ok) throw 0; await abrirArquivo(nome, ext === "stl" ? await r.arrayBuffer() : await r.text()); }
    catch(e){ mostrarPalco("vazio"); $("vVazio").innerHTML = "<b>Esse site não deixa abrir direto</b><span>Baixe o arquivo e solte em “Meu arquivo”.</span>"; }
    return;
  }
  mostrarPalco("vazio"); $("vVazio").innerHTML = "<b>Formato não reconhecido</b><span>Use um endereço terminado em .glb, .gltf, .stl ou .obj.</span>";
}
async function abrirDoComputador(arq){
  const ext = arq.name.toLowerCase().split(".").pop();
  if (ext === "glb" || ext === "gltf") return mostrarGlb(URL.createObjectURL(arq), arq.name, ext === "gltf" ? "Arquivos .gltf com texturas separadas podem não aparecer: prefira .glb" : "");
  if (ext === "stl") return abrirArquivo(arq.name, await arq.arrayBuffer());
  if (ext === "obj") return abrirArquivo(arq.name, await arq.text());
  mostrarPalco("vazio"); $("vVazio").innerHTML = "<b>Formato não aceito</b><span>Use .glb, .gltf, .stl ou .obj.</span>";
}

/* ---------- Sketchfab (API pública de busca + visualização incorporada) ---------- */
async function buscarSketchfab(q, f){
  const u = new URL("https://api.sketchfab.com/v3/search"); u.searchParams.set("type", "models"); u.searchParams.set("q", q); u.searchParams.set("count", "24");
  if (f && f.animated) u.searchParams.set("animated", "true"); if (f && f.downloadable) u.searchParams.set("downloadable", "true");
  const r = await comTempo(12000, sg => fetch(u, {signal: sg})); if (!r.ok) throw new Error("busca"); return (await r.json()).results || [];
}
function mostrarSketchfab(m){
  mostrarPalco("sketch"); const fr = $("vSketch"); fr.src = `https://sketchfab.com/models/${m.uid}/embed?autostart=1&ui_theme=dark&dnt=1`;
  $("vInfo").hidden = false;
  infoPalco(m.name, [`por ${(m.user && (m.user.displayName || m.user.username)) || "autor"} no Sketchfab`, (m.license && m.license.label) ? "Licença: " + m.license.label : "",
    {html: `<a href="${m.viewerUrl || ("https://sketchfab.com/models/" + m.uid)}" target="_blank" rel="noopener">Abrir no Sketchfab (baixar, se o autor permitir)</a>`}].filter(Boolean));
}

/* ---------- Abas do visor ---------- */
const ABAS_VISOR = [["galeria", "Galeria"], ["sketchfab", "Sketchfab"], ["arquivo", "Meu arquivo"], ["editores", "Editores"]];

  const abas = $("vAbas"); abas.innerHTML = "";

    const b = document.createElement("button"); b.className = "aba"; b.role = "tab"; b.textContent = nome; b.setAttribute("aria-selected", String(id === visorAba));

function montarLadoVisor(){
  const lado = $("vLado"); lado.innerHTML = "";
  if (visorAba === "galeria"){
    const g = document.createElement("div"); g.className = "cartoes";
    for (const m of GALERIA){
      const c = document.createElement("button"); c.className = "cartao3d"; if (modeloAtual === m) c.setAttribute("aria-current", "true");
      c.innerHTML = `<span class="mini">${ICONE_CUBO}</span><b></b><small></small>`; c.querySelector("b").textContent = m.nome; c.querySelector("small").textContent = m.tag;
      c.onclick = () => { modeloAtual = m; mostrarGlb(m.urls, m.nome, m.credito); montarLadoVisor(); }; g.appendChild(c);
    }
    lado.appendChild(g);
  } else if (visorAba === "sketchfab"){
    const f = {animated: false, downloadable: false};
    const bus = document.createElement("div"); bus.className = "busca";
    const campo = document.createElement("input"); campo.className = "campo"; campo.placeholder = "Buscar modelos (ex.: foguete, dinossauro)"; campo.value = campo.dataset.q = "space";
    const ir = botao("Buscar", () => rodar()); bus.append(campo, ir); lado.appendChild(bus);
    const chips = document.createElement("div"); chips.className = "chips"; lado.appendChild(chips);
    const res = document.createElement("div"); res.className = "cartoes"; lado.appendChild(res);
    const msg = document.createElement("p"); msg.className = "nota"; lado.appendChild(msg);
    const rodar = async () => {
      msg.textContent = "Buscando…"; res.innerHTML = "";
      try{
        const lista = await buscarSketchfab(campo.value || "space", f); msg.textContent = lista.length ? "Toque num modelo. Os créditos e a licença de cada um aparecem no visor." : "Nada encontrado.";
        for (const m of lista){
          const imgs = (m.thumbnails && m.thumbnails.images) || [], t = imgs.slice().sort((a, b) => Math.abs(a.width - 320) - Math.abs(b.width - 320))[0];
          const c = document.createElement("button"); c.className = "cartao3d";
          c.innerHTML = `<img class="mini" alt="" loading="lazy"><b></b><small></small>`; if (t) c.querySelector("img").src = t.url; else c.querySelector("img").remove();
          c.querySelector("b").textContent = m.name; c.querySelector("small").textContent = (m.user && m.user.displayName) || "";
          c.onclick = () => mostrarSketchfab(m); res.appendChild(c);
        }
      }catch(e){ msg.textContent = "Não consegui falar com o Sketchfab agora."; }
    };
    for (const [rot, ac] of [["Animados", () => { f.animated = !f.animated; return f.animated; }], ["Para imprimir em 3D", () => { f.downloadable = !f.downloadable; if (f.downloadable) campo.value = "3d print"; return f.downloadable; }],
                             ["Espaço", () => { campo.value = "spacecraft astronaut planet"; return null; }], ["Feito no Blender", () => { campo.value = "blender"; return null; }]]){
      const ch = botao(rot, e => { const r = ac(); if (r !== null) e.target.setAttribute("aria-pressed", String(r)); rodar(); }); chips.appendChild(ch);
    }
    campo.onkeydown = e => { if (e.key === "Enter") rodar(); }; rodar();
  } else if (visorAba === "arquivo"){
    const z = document.createElement("button"); z.className = "soltar"; z.innerHTML = "<b>Solte um arquivo aqui</b><span>ou toque para escolher: .glb, .gltf, .stl, .obj</span>";
    const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".glb,.gltf,.stl,.obj"; inp.hidden = true; inp.onchange = () => inp.files[0] && abrirDoComputador(inp.files[0]);
    z.onclick = () => inp.click();
    for (const ev of ["dragenter", "dragover"]) z.addEventListener(ev, e => { e.preventDefault(); z.classList.add("sobre"); });
    for (const ev of ["dragleave", "drop"]) z.addEventListener(ev, e => { e.preventDefault(); z.classList.remove("sobre"); });
    z.addEventListener("drop", e => { const a = e.dataTransfer.files[0]; if (a) abrirDoComputador(a); });
    lado.append(z, inp);
    const r = document.createElement("div"); r.className = "busca"; r.style.marginTop = "12px";
    const campo = document.createElement("input"); campo.className = "campo"; campo.placeholder = "…ou cole o endereço de um .glb/.stl/.obj"; campo.onkeydown = e => { if (e.key === "Enter") abrirPorEndereco(campo.value); };
    r.append(campo, botao("Abrir", () => abrirPorEndereco(campo.value))); lado.appendChild(r);
    const n = document.createElement("p"); n.className = "nota";
    n.textContent = "Os arquivos abrem no seu aparelho e não são enviados para nenhum servidor. Para impressão 3D, o STL mostra as medidas e o volume.";
    lado.appendChild(n);
  } else {
    const n = document.createElement("p"); n.className = "nota"; n.style.marginTop = "0";
    n.innerHTML = "<b>E o Blender?</b> O Blender completo não roda dentro do navegador. Faça o modelo e a animação no Blender, exporte como <b>.glb</b> e abra em “Meu arquivo”: as animações aparecem aqui, com botão de play.";
    lado.appendChild(n);
    for (const e of EDITORES){
      const a = document.createElement("a"); a.className = "item"; a.href = e.url; a.target = "_blank"; a.rel = "noopener"; a.style.textDecoration = "none"; a.style.color = "inherit";
      a.innerHTML = `<span class="pino" style="background:#E9D48E">↗</span><span><b></b><span class="sub"></span></span>`; a.querySelector("b").textContent = e.nome; a.querySelector(".sub").textContent = e.desc; lado.appendChild(a);
    }
  }
}

/* =====================================================================

let imersivo = false, toqueTimer = null;
function setImersivo(v){
  if (imersivo === v) return;
  imersivo = v; document.body.classList.toggle("imersivo", v);
  if (v){ fecharPaineis(); selecionar(null); $("dica").style.opacity = 0; }

/* =====================================================================
   TELAS: relógio, celular em pé/deitado, tablet, computador e monitor largo
   ===================================================================== */
let telaAnterior = "";
function definirTela(){
  const w = innerWidth, h = innerHeight, m = Math.min(w, h), q = new URLSearchParams(location.search).get("tela");
  const relogio = q === "relogio" || (m <= 300) || (/Wear ?OS|Galaxy Watch|SM-R\d{3}|Tizen/i.test(navigator.userAgent) && m <= 520);
  let t = relogio ? "relogio" : (h <= 500 && w > h) ? "paisagem" : w >= 900 ? "ampla" : w <= 480 ? "compacta" : "media";
  if (q && ["relogio","paisagem","ampla","compacta","media"].includes(q)) t = q;
  if (t === telaAnterior) return;
  document.body.dataset.tela = t;
  if (t === "relogio") recolherBarra(true); else if (telaAnterior === "relogio") recolherBarra(false);
  telaAnterior = t;
}
function recolherBarra(v){
  $("barra").classList.toggle("recolhida", v); $("btnMenu").setAttribute("aria-expanded", String(!v));
  if (v) fecharPaineis();
}

/* Folhas arrastáveis (celular): arraste a alça para baixo para fechar; toque na alça do painel de informações para recolher */
function arrastarFolha(alca, el, aoFechar, aoToque){
  let y0 = null, dy = 0;
  alca.addEventListener("pointerdown", e => { y0 = e.clientY; dy = 0; alca.setPointerCapture(e.pointerId); el.style.transition = "none"; });
  alca.addEventListener("pointermove", e => { if (y0 === null) return; dy = Math.max(0, e.clientY - y0); el.style.transform = `translateY(${dy}px)`; });
  const fim = () => {
    if (y0 === null) return;
    el.style.transition = ""; el.style.transform = ""; const moveu = dy; y0 = null;
    if (moveu > 90) aoFechar(); else if (moveu < 6 && aoToque) aoToque();
  };
  alca.addEventListener("pointerup", fim); alca.addEventListener("pointercancel", fim);
}

/* Brilho especular do vidro segue o dedo/mouse; lente de refração só em telas com mouse (poupa bateria no celular) */
function ativarVidro(){
  const luz = e => {
    const v = e.target.closest && e.target.closest(".vidro"); if (!v) return;
    const r = v.getBoundingClientRect();
    v.style.setProperty("--mx", ((e.clientX - r.left) / r.width * 100).toFixed(1) + "%");
    v.style.setProperty("--my", ((e.clientY - r.top) / r.height * 100).toFixed(1) + "%");
  };
  document.addEventListener("pointermove", luz, {passive: true}); document.addEventListener("pointerdown", luz, {passive: true});
  const mouse = matchMedia("(hover:hover) and (pointer:fine)").matches;
  const ok = window.CSS && (CSS.supports("backdrop-filter", "url(#lente) blur(1px)") || CSS.supports("-webkit-backdrop-filter", "url(#lente) blur(1px)"));
  if (mouse && ok) document.documentElement.classList.add("lente");
}

/* =====================================================================
   INICIALIZAÇÃO
   ===================================================================== */
function iniciar(){
  if (typeof Cesium === "undefined"){
    $("carregando").innerHTML = "<div><b>Não foi possível carregar o mapa 3D.</b>Verifique a internet e recarregue a página.</div>"; return; }
  $("btnCatalogo").onclick = () => alternar("catalogo", "btnCatalogo");
  $("btnLista").onclick = () => alternar("lista", "btnLista");
  $("btnCamadas").onclick = () => alternar("camadas", "btnCamadas");
  $("vInfo").onclick = () => $("vInfo").classList.toggle("aberto");
  $("btnObjetos").onclick = () => ($("visor").hidden ? abrirVisor() : fecharVisor()); $("vFechar").onclick = fecharVisor;
  arrastarFolha($("alcaVisor"), $("visor"), fecharVisor);
  relevoOn = lerGuardado("mapa.relevo", "0") === "1"; prediosOn = lerGuardado("mapa.predios", "0") === "1";
  $("btnPinos").onclick = alternarPinos; $("chavePinos").onclick = alternarPinos;
  $("voltar").onclick = () => { selecionar(null); if (viewer){ viewer.trackedEntity = undefined; visaoInicial(true); } };
  $("fechar").onclick = () => selecionar(null);
  $("btnMenu").onclick = () => recolherBarra(!$("barra").classList.contains("recolhida"));
  $("cartao").onclick = () => $("cartao").classList.toggle("min");
  arrastarFolha(document.querySelector('.alca[data-fecha="catalogo"]'), $("catalogo"), fecharPaineis);
  arrastarFolha(document.querySelector('.alca[data-fecha="lista"]'), $("lista"), fecharPaineis);
  arrastarFolha(document.querySelector('.alca[data-fecha="camadas"]'), $("camadas"), fecharPaineis);
  arrastarFolha($("alcaInfo"), $("info"), () => selecionar(null), () => $("info").classList.toggle("min"));
  definirTela(); ativarVidro();
  addEventListener("resize", definirTela); addEventListener("orientationchange", () => setTimeout(definirTela, 250));
  setTimeout(() => { $("dica").style.opacity = 0; }, 6500);
  $("zmMais").onclick = () => zoom(0.5); $("zmMenos").onclick = () => zoom(2);
  document.addEventListener("keydown", e => {
    if (e.key === "Escape"){ if (!$("visor").hidden) fecharVisor(); else if (imersivo) setImersivo(false); else { selecionar(null); fecharPaineis(); } }
    else if (e.key === "h" || e.key === "H") setImersivo(!imersivo);
  });
  /* ?astro=marte abre direto em um astro */
  const pedido = new URLSearchParams(location.search).get("astro");
  const inicial = ASTROS.find(x => x.id === pedido) || ASTROS.find(x => x.id === "terra");
  try{ carregarAstro(inicial); }
  catch(e){ $("carregando").textContent = "Seu navegador não conseguiu iniciar o 3D (WebGL). Tente outro navegador."; console.error(e); }
}
iniciar();
